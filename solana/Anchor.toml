skip_local_validator = true

[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
deliver = "EcoyzRRwsSsFz6i4YU6r28WGD9mamCtRi4Zc8w78FNjw"

[programs.devnet]
deliver = "EcoyzRRwsSsFz6i4YU6r28WGD9mamCtRi4Zc8w78FNjw"

[programs.mainnet]
deliver = "EcoyzRRwsSsFz6i4YU6r28WGD9mamCtRi4Zc8w78FNjw"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"
# Deploys are IMMUTABLE by default — script/deploy.sh deploys, verifies the on-chain bytes
# against the local build, and only then sets the upgrade authority to none. Do not replace these
# with a bare `anchor deploy`, which leaves the program upgradeable and the EVM/SVM trust models
# asymmetric (see PARITY.md row 13a).
deploy-devnet = "SOLANA_RPC_URL=https://api.devnet.solana.com ./script/deploy.sh"
deploy-mainnet = "./script/deploy.sh"

